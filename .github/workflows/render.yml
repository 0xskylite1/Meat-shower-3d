name: render-gate

on:
  push:
    paths:
      - "src/**"
      - "package.json"
      - "render_gate.mjs"
      - ".github/workflows/render.yml"

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Render gate still
        run: node render_gate.mjs
      - name: Commit result back
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/
          git commit -m "gate result [skip ci]" || echo "nothing to commit"
          git push
          
